name: daily-refresh

# Refresh the board every US trading day after the close (16:20 ET = 20:20 UTC).
on:
  schedule:
    - cron: "20 20 * * 1-5"
  workflow_dispatch:  # manual trigger from the Actions tab

# The "Commit fresh data" step pushes back to the repo, so the token needs write.
# Deps are pinned in requirements.txt (yfinance==1.7.0: option_chain API).
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run pipeline
        run: python src/pipeline.py
      - name: Commit fresh data
        run: |
          git config user.name "premium-bot"
          git config user.email "premium-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "daily refresh $(date -u +%F)"
          git push
